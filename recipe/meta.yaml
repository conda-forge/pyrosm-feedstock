{% set version = "0.26.0" %}
{% set name = "pyrosm" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cd089e9abbffabb0ead65cd245517535296aeb651645c47c7f12530d8a1cfe94

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<311]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
    - cython
    - certifi
    - geopandas >=0.12.0
    - protobuf >=6.33.5
    - python-rapidjson
    - shapely >=2.1
  run:
    - python
    - setuptools >=18.0
    - certifi
    - geopandas >=0.12.0
    - protobuf >=6.33.5
    - python-rapidjson
    - shapely >=2.1
    - tqdm >=4.66

test:
  imports:
    - pyrosm
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/pyrosm/pyrosm
  license: BSD-3-Clause AND MIT
  license_file:
    - LICENSE
    - vendor/khash/LICENSE
    - vendor/libdeflate/COPYING
  summary: A Python tool to parse OSM data from Protobuf format into Geopandas GeoDataFrames.

extra:
  recipe-maintainers:
    - htenkanen
